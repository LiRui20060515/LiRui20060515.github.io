<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Hanoi 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(to bottom, #87CEEB, #E6E6FA); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { text-align: center; width: 100%; max-width: 900px; }
        h1 { color: #333; margin-bottom: 20px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; background-color: #4CAF50; color: white; cursor: pointer; font-size: 16px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .warning { background-color: #ffdddd; color: #d8000c; padding: 10px; border-radius: 4px; margin-bottom: 15px; opacity: 1; }
        .warning.hidden { opacity: 0; }
        .tower-container { display: flex; justify-content: space-around; align-items: flex-end; height: 350px; perspective: 1000px; margin-top: 30px; }
        .peg { width: 20px; height: 300px; background: linear-gradient(to right, #8B4513, #A0522D, #8B4513); border-radius: 10px 10px 0 0; display: flex; flex-direction: column-reverse; align-items: center; position: relative; }
        .peg::before { content: ''; position: absolute; bottom: -10px; width: 80px; height: 10px; background: linear-gradient(to bottom, #A0522D, #8B4513); border-radius: 5px; }
        .disk { height: 25px; border-radius: 5px; margin: 2px 0; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s ease; }
        .disk:hover { transform: translateY(-5px); }
        .disk-1 { width: 60px; background: linear-gradient(to bottom, #ff6b6b, #ee5a5a); }
        .disk-2 { width: 80px; background: linear-gradient(to bottom, #ffca3a, #f9c00c); }
        .disk-3 { width: 100px; background: linear-gradient(to bottom, #8ac926, #6fbc23); }
        .disk-4 { width: 120px; background: linear-gradient(to bottom, #1982c4, #1268a0); }
        .disk-5 { width: 140px; background: linear-gradient(to bottom, #6a4c93, #553d7a); }
        .disk-6 { width: 160px; background: linear-gradient(to bottom, #ff9f1c, #e68900); }
        .disk-7 { width: 170px; background: linear-gradient(to bottom, #e63946, #d62828); }
        .disk-8 { width: 180px; background: linear-gradient(to bottom, #2a9d8f, #21867a); }
        .victory-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .victory-modal.hidden { display: none; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏰 Tower of Hanoi (3D)</h1>
        <div class="controls">
            <div class="control-group">
                <label for="diskCount">Number of disks (3-8):</label>
                <input type="number" id="diskCount" min="3" max="8" value="5">
            </div>
            <div class="control-group">
                <p>Moves: <span id="moveCount">0</span></p >
            </div>
            <button id="resetBtn">Reset</button>
            <button id="autoSolveBtn">Auto Solve</button>
        </div>
        <div id="warning" class="warning hidden">⚠️ Cannot place larger disk on smaller disk!</div>
        <div class="tower-container">
            <div class="peg" id="pegA" data-peg="A"></div>
            <div class="peg" id="pegB" data-peg="B"></div>
            <div class="peg" id="pegC" data-peg="C"></div>
        </div>
    </div>
    <div class="victory-modal hidden" id="victoryModal">
        <div class="modal-content">
            <h2>🎉 Victory!</h2>
            <p>You solved the puzzle in <span id="finalMoves">0</span> moves!</p >
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>
    <script>
        class HanoiGame {
            constructor() {
                this.gameState = { disksCount: 5, pegs: [[], [], []], moves: 0, isAutoSolving: false, selectedPegIndex: null };
                this.initElements(); this.bindEvents(); this.resetGame();
            }
            initElements() {
                this.diskCountInput = document.getElementById('diskCount');
                this.moveCountEl = document.getElementById('moveCount');
                this.resetBtn = document.getElementById('resetBtn');
                this.autoSolveBtn = document.getElementById('autoSolveBtn');
                this.warningEl = document.getElementById('warning');
                this.victoryModal = document.getElementById('victoryModal');
                this.finalMovesEl = document.getElementById('finalMoves');
                this.playAgainBtn = document.getElementById('playAgainBtn');
                this.pegsEls = document.querySelectorAll('.peg');
            }
            bindEvents() {
                this.diskCountInput.addEventListener('change', () => {
                    const count = parseInt(this.diskCountInput.value);
                    if (count >= 3 && count <= 8) { this.gameState.disksCount = count; this.resetGame(); }
                    else this.diskCountInput.value = this.gameState.disksCount;
                });
                this.resetBtn.addEventListener('click', () => this.resetGame());
                this.autoSolveBtn.addEventListener('click', () => this.autoSolve());
                this.playAgainBtn.addEventListener('click', () => { this.victoryModal.classList.add('hidden'); this.resetGame(); });
                this.pegsEls.forEach((pegEl, index) => { pegEl.addEventListener('click', () => this.handlePegClick(index)); });
            }
            resetGame() {
                this.gameState.moves = 0; this.gameState.isAutoSolving = false; this.gameState.selectedPegIndex = null; this.gameState.pegs = [[], [], []];
                for (let i = this.gameState.disksCount; i >= 1; i--) this.gameState.pegs[0].push(i);
                this.updateMoveCount(); this.render(); this.hideWarning(); this.enableControls();
            }
            render() {
                this.pegsEls.forEach(pegEl => pegEl.innerHTML = '');
                this.gameState.pegs.forEach((stack, pegIndex) => {
                    stack.forEach(diskSize => {
                        const diskEl = document.createElement('div');
                        diskEl.className = `disk disk-${diskSize}`;
                        diskEl.dataset.size = diskSize;
                        diskEl.dataset.peg = pegIndex;
                        this.pegsEls[pegIndex].appendChild(diskEl);
                    });
                });
            }
            handlePegClick(pegIndex) {
                if (this.gameState.isAutoSolving) return;
                if (this.gameState.selectedPegIndex === null) {
                    if (this.gameState.pegs[pegIndex].length > 0) { this.gameState.selectedPegIndex = pegIndex; this.pegsEls[pegIndex].lastChild.style.transform = 'translateY(-10px)'; }
                } else {
                    const fromIndex = this.gameState.selectedPegIndex;
                    const toIndex = pegIndex;
                    if (fromIndex !== toIndex) {
                        if (this.isValidMove(fromIndex, toIndex)) this.executeMove(fromIndex, toIndex);
                        else this.showWarning();
                    }
                    if (this.gameState.pegs[fromIndex].length > 0) this.pegsEls[fromIndex].lastChild.style.transform = '';
                    this.gameState.selectedPegIndex = null;
                }
            }
            isValidMove(fromIndex, toIndex) {
                const fromStack = this.gameState.pegs[fromIndex];
                const toStack = this.gameState.pegs[toIndex];
                if (fromStack.length === 0) return false;
                const movingDisk = fromStack[fromStack.length - 1];
                const topDisk = toStack.length > 0 ? toStack[toStack.length - 1] : null;
                return topDisk === null || movingDisk < topDisk;
            }
            executeMove(fromIndex, toIndex) {
                const disk = this.gameState.pegs[fromIndex].pop();
                this.gameState.pegs[toIndex].push(disk);
                this.gameState.moves++; this.updateMoveCount(); this.render();
                if (this.checkWin()) setTimeout(() => this.showVictory(), 300);
            }
            checkWin() { return this.gameState.pegs[2].length === this.gameState.disksCount; }
            showWarning() { this.warningEl.classList.remove('hidden'); this.warningEl.classList.add('show'); setTimeout(() => this.hideWarning(), 1000); }
            hideWarning() { this.warningEl.classList.add('hidden'); this.warningEl.classList.remove('show'); }
            showVictory() { this.finalMovesEl.textContent = this.gameState.moves; this.victoryModal.classList.remove('hidden'); }
            updateMoveCount() { this.moveCountEl.textContent = this.gameState.moves; }
            enableControls() { this.autoSolveBtn.disabled = false; this.resetBtn.disabled = false; this.diskCountInput.disabled = false; }
            disableControls() { this.autoSolveBtn.disabled = true; this.resetBtn.disabled = true; this.diskCountInput.disabled = true; }
            async autoSolve() {
                if (this.gameState.isAutoSolving || this.checkWin()) return;
                this.gameState.isAutoSolving = true; this.disableControls();
                await this.solveRecursive(this.gameState.disksCount, 0, 2, 1);
                this.gameState.isAutoSolving = false; this.enableControls();
            }
            async solveRecursive(n, source, target, auxiliary) {
                if (n === 0) return;
                await this.solveRecursive(n - 1, source, auxiliary, target);
                await this.sleep(500);
                this.executeMove(source, target);
                await this.solveRecursive(n - 1, auxiliary, target, source);
            }
            sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        }
        // 这行是游戏启动的关键！
        document.addEventListener('DOMContentLoaded', () => { new HanoiGame(); });
    </script>
</body>
</html>
