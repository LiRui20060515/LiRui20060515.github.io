<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Hanoi 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏰 Tower of Hanoi (3D)</h1>

        <div class="controls">
            <div class="control-group">
                <label for="diskCount">Number of disks (3-8):</label>
                <input type="number" id="diskCount" min="3" max="8" value="5">
            </div>
            <div class="control-group">
                <p>Moves: <span id="moveCount">0</span></p >
            </div>
            <button id="resetBtn">Reset</button>
            <button id="autoSolveBtn">Auto Solve</button>
        </div>

        <div id="warning" class="warning hidden">⚠️ Cannot place larger disk on smaller disk!</div>

        <div class="tower-container">
            <div class="peg" id="pegA" data-peg="A"></div>
            <div class="peg" id="pegB" data-peg="B"></div>
            <div class="peg" id="pegC" data-peg="C"></div>
        </div>
    </div>

    <div class="victory-modal hidden" id="victoryModal">
        <div class="modal-content">
            <h2>🎉 Victory!</h2>
            <p>You solved the puzzle in <span id="finalMoves">0</span> moves!</p >
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <!-- 这行是关键！必须加上，否则圆盘不会显示 -->
    <script src="script.js"></script>
</body>
</html>
